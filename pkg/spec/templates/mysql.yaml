# yaml-language-server: $schema=https://raw.githubusercontent.com/kirilurbonas/FireDrill/main/pkg/spec/firedrill.schema.json
apiVersion: firedrill.dev/v1
kind: RecoveryDrill
metadata:
  name: orders-db
spec:
  objectives:
    rto: 15m
    rpo: 24h
  source:
    driver: mysql
    from:
      type: file
      uri: ./orders.sql       # mysqldump output; .gz/.zst are decompressed for you
      # type: s3
      # uri: s3://acme-backups/orders/
      # select: latest
      # match: "orders-*.sql.gz"
  sandbox:
    provider: docker
    image: mysql:8.4
    ttl: 30m
  verify:
    - restoreSucceeded: {}
    - freshness: { maxAge: 24h }
    - rowCount: { query: "select count(*) from orders", min: 1 }
    - checksum: { table: orders, column: id }
    # - canary: { sql: "select token from firedrill_canary", expect: "fd-canary-2f8a91c4" }
  report:
    sign: true
    html: true
